# Reverse-proxies /api/ to the backend Compose service, so the browser
# only ever talks to this one origin -- same-origin, no CORS needed
# (docs/TASKS.md T143). `try_files` falls back to index.html for every
# other path so React Router's client-side routes work on a hard refresh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
