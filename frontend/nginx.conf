# Reverse-proxies /api/ to the backend Compose service, so the browser
# only ever talks to this one origin -- same-origin, no CORS needed
# (docs/TASKS.md T143). `try_files` falls back to index.html for every
# other path so React Router's client-side routes work on a hard refresh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx's own default (60s) is shorter than the AI provider call
        # chain's real worst case: RetryingProvider tries the primary
        # model (up to a 60s adapter timeout), then on failure falls back
        # to a second one (another up to 60s) -- docs/TASKS.md T151/T152,
        # reported live as a 504 Gateway Timeout on a request the backend
        # would otherwise have answered (successfully or with a clean
        # error) a little past the 60s mark. 180s gives headroom above
        # that ~120s worst case rather than matching it exactly.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
